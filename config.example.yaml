# 复制为 config.yaml 后填写真实信息
#
# api_id / api_hash 从 https://my.telegram.org 获取（可选）
# 若官网创建应用报 ERROR，可先省略这两项，程序会使用内置默认值

telegram:
  # api_id: 12345678
  # api_hash: "your_api_hash_here"
  phone: "+8613800138000"
  # 两步验证密码，未开启则留空
  password: ""
  # 会话文件路径，登录成功后复用，无需重复验证码
  session: "sessions/tg_monitor"

monitor:
  # 监听私信：来自以下用户的消息（username 或 user_id）
  private_users:
    - "some_username"
    # - "123456789"

  # 监听群组：以下群组中 @ 当前用户 或 引用回复 当前用户 的消息（群组 username 或 chat_id）
  groups:
    - "some_group_username"
    # - "-1001234567890"
  group_browse_interval_minutes: 20  # 定时浏览群组间隔（分钟），0 表示关闭
  group_browse_message_limit: 5       # 每次浏览读取的消息条数；仅在推送开启且非免打扰时执行，50% 概率

# 可发送管理命令的私信用户（username 或 user_id）
# 群消息支持 /id@当前用户 命令，返回当前群 ID
# 私信命令: /open push /close push /open duty /close duty /status
command:
  users:
    - "your_user_id"
    # - "admin_username"

push:
  enabled: true
  url: "https://push.i-i.me"
  method: "POST"          # GET 或 POST
  push_key: "your_push_key"
  type: "text"
  heartbeat_interval_minutes: 30  # 无推送超过该分钟数后发送心跳
  quiet_hours:                     # 免打扰时段，支持多个；跨天写法如 23:00-09:00
    - start: "23:00"
      end: "09:00"
    # - start: "12:00"
    #   end: "13:00"
  work_hours:                      # 上班时段，支持多个；该时段内群消息全量推送
    - start: "09:00"
      end: "18:00"
    # - start: "14:00"
    #   end: "17:00"
