# 复制为 config.yaml 后填写真实信息
#
# api_id / api_hash 从 https://my.telegram.org 获取（可选）
# 若官网创建应用报 ERROR，可先省略这两项，程序会使用内置默认值

telegram:
  # api_id: 12345678
  # api_hash: "your_api_hash_here"
  phone: "+8613800138000"
  # 两步验证密码，未开启则留空
  password: ""
  # 会话文件路径，登录成功后复用，无需重复验证码
  session: "sessions/tg_monitor"

monitor:
  # 监听私信：来自以下用户的消息（username 或 user_id）
  private_users:
    - "some_username"
    # - "123456789"

  # 监听群组：配置群中 @/回复 当前用户；值班/上班时段配置群全量推送。
  # 上班时段，未配置群中 @ 或引用回复当前用户也会推送（需推送开启；值班时不推未配置群）。
  groups:
    - "some_group_username"
    # - "-1001234567890"
  # 这些群先丢弃 @当前账号 的消息，再走原有推送流程。
  # 用于转发汇总群：其他群的 @ 会被程序转到这里，避免重复推送。
  skip_mention_groups:
    # - "forward_group_username"
    # - "5135511617"
  group_browse_interval_minutes: 20  # 定时浏览群组间隔（分钟），0 表示关闭
  group_browse_message_limit: 5       # 每次浏览读取的消息条数
  group_browse_probability:           # 每轮定时任务的执行概率（非每个群），支持分数(1/2)或小数(0.5)
    duty: "1/19"                      # 值班模式
    work: "1/3"                       # 上班时间
    default: "1/29"                   # 其他时段

# 管理命令：推荐配置 bot_token，用 @BotFather 创建机器人后在对话框「/」菜单操作
# command.users 中的用户可使用机器人；监听账号私信仍支持旧命令
# 机器人命令: /status /push_on /push_off /duty_on /duty_off /chatid /export_groups /help
# 群消息仍支持 /id@监听账号用户名 返回群 ID（由监听账号处理）
command:
  users:
    - "your_user_id"
    # - "admin_username"
  # bot_token: "123456789:AA..."

# /export_groups 导出登录账号加入的群与成员（groups_export.xlsx，两个 sheet）
# include_groups 非空时仅导出列表中的群；exclude_groups 始终排除
group_export:
  output_dir: exports
  include_groups: []
  # - "-1001234567890"
  exclude_groups: []
  # - "spam_group_username"
  download_avatars: true
  exclude_bots: true              # 成员 sheet 排除机器人
  exclude_deleted_accounts: true  # 排除已注销/失效账号
  exclude_scam_accounts: true
  exclude_fake_accounts: true
  max_members_per_group: 0   # 0 表示不限制；groups 表 includes_all_members 表示未触达该上限
  groups_per_checkpoint: 5   # 每导出 N 个群暂停，由机器人在聊天中确认；0=不分批
  checkpoint_timeout_seconds: 120  # 确认超时（秒），超时视为终止
  # /export_groups 10 — 每批 10 个群（N<1000）
  # /export_groups 4215609865 — 群 ID 精确匹配（N≥1000）
  # /export_groups decent — 群名称/用户名模糊匹配 %decent%

push:
  enabled: true
  url: "https://api.day.app"
  device_key: "your_bark_device_key"
  group_broadcast_push_limit_per_minute: 10  # 每个群非 @/引用 消息每分钟最多推送条数，0 表示不限制
  quiet_hours:                     # 免打扰时段，支持多个；跨天写法如 23:00-09:00
    - start: "23:00"
      end: "09:00"
    # - start: "12:00"
    #   end: "13:00"
  work_hours:                      # 上班时段，支持多个；配置群全量推送，未配置群仅 @/回复 推送
    - start: "09:00"
      end: "18:00"
    # - start: "14:00"
    #   end: "17:00"
