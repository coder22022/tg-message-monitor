# 复制为 config.yaml 后填写真实信息
#
# api_id / api_hash 从 https://my.telegram.org 获取（可选）
# 若官网创建应用报 ERROR，可先省略这两项，程序会使用内置默认值

telegram:
  # api_id: 12345678
  # api_hash: "your_api_hash_here"
  phone: "+14472515124"
  # 两步验证密码，未开启则留空
  password: "yp1234567"
  # 会话文件路径，登录成功后复用，无需重复验证码
  session: "sessions/tg_monitor"

monitor:
  # 监听私信：来自以下用户的消息（username 或 user_id）
  private_users:
    # CSP001 Lotus
    - "6151031824"
    # dan
    - "7897612775"
    # EVAN
    - "7687500051"
    # Limo
    - "7306380546"
    # ray
    - "1791695995"
    # human
    # - "6905416669"

  # 监听群组：以下群组中 @ 当前用户 的消息（群组 username 或 chat_id）
  groups:
    # Decent 技术沟通群
    - "4215609865"
    # Decent 公司群
    - "2134280037"
    # 技术内部沟通群
    - "4893951761"
    # "TG群"
    - "5509798997"
    # "技术处理集中提醒"
    - "5135511617"
  group_browse_interval_minutes: 3
  group_browse_message_limit: 15
  group_browse_probability:        # 每轮定时任务的执行概率（非每个群），支持分数(1/2)或小数(0.5)
    duty: "1/10"                  # 值班模式
    work: "1/2"                   # 上班时间
    default: "1/20"                # 其他时段

# 可发送管理命令的私信用户（username 或 user_id）
command:
  users:
    - "6905416669"

push:
  enabled: true
  url: "https://api.day.app"
  device_key: "KFP9bdarh5YM9ZQMMVrTeB"
  group_broadcast_push_limit_per_minute: 3  # 非 @/引用 的群消息每分钟最多推送条数，0 表示不限制
  quiet_hours:
    - start: "23:00"
      end: "09:00"
  work_hours:
    - start: "09:30"
      end: "11:00"
    - start: "13:30"
      end: "18:00"